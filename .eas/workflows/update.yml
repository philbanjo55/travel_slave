name: JS Update (instant patch)

# Push to `update` that changes app JavaScript -> instant (OTA) update to the
# APK on the phone. Same job as before (channel `preview`, default
# environment), now limited to app code so backend/docs/web commits do not
# publish anything.
#
# Native changes (package.json, app.json, app.config.js, eas.json) are built
# into a new APK by native-build.yml instead. When a change adds or upgrades
# a native library, bump "runtimeVersion" in app.json in the same commit so
# this update only reaches the new APK. (Expo's automatic fingerprint check
# needs SDK 52+; this app is on SDK 51.)

on:
  push:
    branches:
      - update
    paths:
      - src/**
      - App.tsx

jobs:
  update:
    name: Publish JS Update
    type: update
    params:
      channel: preview
      message: ${{ github.event.head_commit.message }}
